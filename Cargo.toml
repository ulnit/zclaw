[package]
name = "ulnclaw"
version = "0.6.5"
edition = "2021"
authors = ["ZStep Team"]
description = "An independently designed AI agent engine written in Rust (hermes-agent compatible)"
repository = "https://gitee.com/ushaw/ulnclaw"
license = "MIT OR Apache-2.0"
keywords = ["ai", "agent", "llm", "tool-calling"]

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v5"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
futures = "0.3"
base64 = "0.22"
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
walkdir = "2"
glob = "0.3"
dirs = "5"
toml = "0.8"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
aes = "0.8"
md-5 = "0.10"
sha1 = "0.10"
jsonwebtoken = "9"
qrcode = { version = "0.14", default-features = false }
url = "2"
percent-encoding = "2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.4", features = ["util"] }
libc = "0.2"

crossterm = "0.28"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
webpki-roots = "0.26"
mailparse = "0.16"
charset = "0.1"

tempfile = "3"
k256 = { version = "0.14.0", features = ["schnorr"] }
tar = "0.4.46"
flate2 = "1.1.9"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "ulnclaw"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
