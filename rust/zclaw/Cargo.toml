[package]
name = "zclaw"
version = "0.3.0"
edition = "2021"
description = "ZClaw mobile agent — FFI v0.2, tracking zeroclaw v0.8.4 improvements"
license = "MIT OR Apache-2.0"

[lib]
name = "zclaw"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
urlencoding = "2"
futures-util = "0.3"
anyhow = "1"
glob = "0.3"
regex = "1"

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"
panic = "abort"
